name: Compilar APK Firmada

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Validar o Generar Gradle Wrapper
      run: |
        if [ ! -f gradlew ]; then
          echo "gradlew no encontrado, generando uno nuevo..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Restaurar keystore desde el secreto
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

    - name: Compilar APK (Modo Release, firmada)
      run: |
        ./gradlew clean assembleRelease --no-build-cache --no-configuration-cache \
          -PRELEASE_STORE_FILE="${{ github.workspace }}/release.keystore" \
          -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
          -PRELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
          -PRELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
          -PVERSION_CODE="${{ github.run_number }}"

    - name: Guardar el archivo APK generado
      uses: actions/upload-artifact@v4
      with:
        name: EcoPos-Release-APK
        path: '**/build/outputs/apk/release/app-release.apk'

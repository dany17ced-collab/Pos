name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: |
        if [ ! -f gradlew ]; then
          echo "gradlew no encontrado, generando uno nuevo..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
        echo "--- Verificación del keystore decodificado ---"
        ls -la release.keystore
        echo "Ruta absoluta: ${{ github.workspace }}/release.keystore"
        file release.keystore || true

        # Verificar que los secretos no lleguen vacíos
        if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then echo "ERROR: KEYSTORE_PASSWORD está vacío"; exit 1; fi
        if [ -z "${{ secrets.KEY_ALIAS }}" ]; then echo "ERROR: KEY_ALIAS está vacío"; exit 1; fi
        if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then echo "ERROR: KEY_PASSWORD está vacío"; exit 1; fi

        # Intentar listar el keystore para verificar que la contraseña es correcta
        keytool -list -keystore release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" || echo "ADVERTENCIA: Falló keytool -list, verifica la contraseña del keystore"

    - name: Build signed release APK
      run: |
        ./gradlew clean assembleRelease \
          -PRELEASE_STORE_FILE=${{ github.workspace }}/release.keystore \
          -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
          -PRELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
          -PRELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
          --no-build-cache --no-configuration-cache --stacktrace
      # Nota: He añadido --stacktrace para ver el error real si Gradle falla

    - name: Verificar firma del APK generado
      run: |
        APK_PATH=$(find ${{ github.workspace }} -name "app-release.apk" | head -1)
        echo "APK encontrado en: $APK_PATH"

        if [ -z "$APK_PATH" ]; then
          echo "ERROR: No se encontró el APK app-release.apk"
          exit 1
        fi

        # Buscar la versión más reciente de apksigner dinámicamente
        APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
        
        if [ -n "$APKSIGNER_PATH" ]; then
          echo "Usando apksigner en: $APKSIGNER_PATH"
          $APKSIGNER_PATH verify --print-certs "$APK_PATH"
        else
          echo "apksigner no encontrado. Intentando con keytool..."
          keytool -printcert -jarfile "$APK_PATH"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EcoPos-Release-APK
        path: '**/build/outputs/apk/release/app-release.apk'
        if-no-files-found: error

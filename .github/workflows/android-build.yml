name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        if [ ! -f gradlew ]; then
          echo "gradlew no encontrado, generando uno nuevo..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

    - name: Build signed release APK
      run: |
        ./gradlew clean assembleRelease \
          -PRELEASE_STORE_FILE=../release.keystore \
          -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
          -PRELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
          -PRELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
          --no-build-cache --no-configuration-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EcoPos-Release-APK
        path: '**/build/outputs/apk/release/app-release.apk'
